<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Comic Exported — ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >

</head>


<body class="success-page">


<main class="success-card">

    <div class="success-icon">
        ✓
    </div>


    <span class="badge">
        EXPORT COMPLETE
    </span>


    <h1>
        Comic exported successfully!
    </h1>


    <p>
        Your AI-powered comic is ready
        to save, share or print.
    </p>


    <a
        class="primary-btn"
        href="/"
    >
        Create Another Comic
    </a>


    {% if pdf_path %}

    <a
        class="text-link"
        href="{{ pdf_path }}"
    >
        Open PDF again
    </a>

    {% endif %}


</main>

</body>

</html>
